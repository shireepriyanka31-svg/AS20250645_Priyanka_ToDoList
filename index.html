<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="bg-custom-blue text-white py-3 px-4 shadow-sm">
        <h5 class="m-0 fw-bold">My To-Do List</h5>
    </header>

    <main class="container d-flex justify-content-center align-items-center py-5">
        <div class="card task-card w-100 border-0 p-4 bg-white">
            <div class="card-body">
                
                <h2 class="text-center fw-bold text-dark mb-1">Task Manager</h2>
                <p class="text-center text-secondary small mb-4">Organize your tasks and stay productive.</p>

                <form id="task-form" class="input-group mb-4">
                    <input type="text" id="task-input" class="form-control" placeholder="Enter a new task..." aria-label="Enter a new task" required>
                    <button class="btn btn-custom-blue px-4" type="submit" id="add-btn">Add Task</button>
                </form>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-semibold text-secondary small">Your tasks</span>
                    <span id="remaining-count" class="badge bg-custom-blue px-2 py-1">0 remaining</span>
                </div>

                <div class="btn-group w-100 mb-4" role="group">
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-primary py-2" for="btnradio1">All</label>

                    <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-primary py-2" for="btnradio2">Active</label>

                    <input type="radio" class="btn-check" name="btnradio" id="btnradio3" autocomplete="off">
                    <label class="btn btn-outline-primary py-2" for="btnradio3">Completed</label>
                </div>

                <div id="task-list" class="border rounded p-2 mb-3">
                    <div id="empty-msg" class="text-center text-muted my-4 small">
                        No tasks yet. Add your first task!
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button id="clear-completed-btn" class="btn btn-outline-danger-custom px-3 py-1 rounded" type="button">Clear Completed</button>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
